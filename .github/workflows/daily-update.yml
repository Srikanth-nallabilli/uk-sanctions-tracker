name: Daily sanctions list check

on:
  schedule:
    # 18:30 UTC every day, after most same-day FCDO updates have been published
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download list and record changes
        run: python -m tracker.update --alert-file alert.md

      - name: Commit updated data
        run: |
          git config user.name "sanctions-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open an alert issue when the list changed
        if: hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create sanctions-alert --color D93F0B --description "Daily list changes" 2>/dev/null || true
          gh issue create \
            --title "$(head -n 1 alert.md | sed 's/^## //')" \
            --body-file alert.md \
            --label sanctions-alert \
            --assignee "${{ github.repository_owner }}"
